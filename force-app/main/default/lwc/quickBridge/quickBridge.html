<template>
  <div class="login-container">
    <div class="login-card">
      <!-- Card Logo -->
      <div class="logo-section">
        <img src={quickBridgeLogo} alt="QuickBridge" class="logo-icon" />
        <div class="logo-text">
          <span class="logo-title">QuickBridge</span>
          <span class="logo-subtitle">The Lodestone Group</span>
        </div>
      </div>

      <h1 class="login-header">Secure Login</h1>

      <form onsubmit={handleLogin}>
        <!-- User ID Input -->
        <div class="form-group">
          <label for="userId" class="form-label">User ID</label>
          <input
            type="text"
            id="userId"
            class="custom-input"
            placeholder="Enter your user ID"
            onchange={handleUserIdChange}
            required
          />
        </div>

        <!-- 4-Digit PIN Input -->
        <div class="form-group pin-group-container">
          <label class="form-label">4-Digit PIN</label>
          <div class="pin-grid">
            <input
              type="text"
              inputmode="numeric"
              pattern="\d*"
              maxlength="1"
              class="pin-input"
              data-index="0"
              oninput={handlePinInput}
              onkeydown={handlePinKeydown}
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="\d*"
              maxlength="1"
              class="pin-input"
              data-index="1"
              oninput={handlePinInput}
              onkeydown={handlePinKeydown}
              disabled
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="\d*"
              maxlength="1"
              class="pin-input"
              data-index="2"
              oninput={handlePinInput}
              onkeydown={handlePinKeydown}
              disabled
            />
            <input
              type="text"
              inputmode="numeric"
              pattern="\d*"
              maxlength="1"
              class="pin-input"
              data-index="3"
              oninput={handlePinInput}
              onkeydown={handlePinKeydown}
              disabled
            />
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn-primary">Sign In</button>

        <!-- Forgot PIN -->
        <div class="forgot-pin">
          <a href="#" onclick={handleForgotPin}> Forgot PIN? </a>
        </div>
      </form>
    </div>
  </div>
</template>
